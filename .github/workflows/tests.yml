name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_db_tests:
        description: Run the long PostgreSQL and installed database qualification suites
        type: boolean
        default: false
      with_doc:
        description: Build and install the English HTML, man and PDF documentation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6; shared pg_diag convention
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: python tools/check_release.py
      - run: python tools/generate_planning_schemas.py && git diff --exit-code -- src/pg_maker/schemas
      - run: python -m pytest -q tests/unit tests/contracts
  distribution:
    runs-on: ubuntu-24.04
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - name: Check release identity
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python tools/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python tools/check_release.py
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_release.py --dist dist
      - run: python tools/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/ci_pipeline.py --work "${RUNNER_TEMP}/pg-maker-fixtures" --fixtures-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fixture-evidence
          path: ${{ runner.temp }}/pg-maker-fixtures/exports
          retention-days: 7

  postgresql:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Build PostgreSQL packages; database tests are explicit
        env:
          RUN_DB_TESTS: ${{ inputs.run_db_tests }}
          WITH_DOC: ${{ inputs.with_doc }}
        shell: bash
        run: |
          args=()
          if [ "$RUN_DB_TESTS" = true ]; then args+=(--run-db-tests); fi
          if [ "$WITH_DOC" = true ]; then args+=(--with-doc); fi
          python tools/ci_pipeline.py --work "${RUNNER_TEMP}/pg-maker-postgresql" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgresql-evidence
          path: ${{ runner.temp }}/pg-maker-postgresql/exports
          retention-days: 7
