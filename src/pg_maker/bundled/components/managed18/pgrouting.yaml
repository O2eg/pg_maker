api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc18-pgrouting
  revision: 1
spec:
  type: library
  source:
    kind: archive
    location: https://codeload.github.com/pgRouting/pgrouting/tar.gz/e7108597bf99fe725bb1c00b1e3125e9ba691aee
    sha256: sha256:7c84012d786747ac394fd0144c363d99684b80da08ee6dc697aca71627d4c98e
    strip_components: 1
  compatible_postgresql: '>=18.4,<19'
  requires:
  - yc18-postgis
  conflicts: []
  build_dependencies:
  - cmake
  - libboost-graph-dev
  - libtap-parser-sourcehandler-pgtap-perl
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: pgrouting
  runtime_files:
  - lib/postgresql/libpgrouting-3.8.so
  - share/postgresql/extension/pgrouting.control
  - share/postgresql/extension/pgrouting--*.sql
  sql_extension_versions:
    pgrouting: 3.8.0
  build_system: cmake
  configure_args:
  - -DPOSTGRESQL_PG_CONFIG={prefix}/bin/pg_config
  - -DPOSTGRESQL_BIN={prefix}/bin
  - -DWITH_DOC=OFF
  extra_sources:
    pgtap:
      kind: git
      repository: https://github.com/theory/pgtap.git
      ref: 968eb53a33114e83042b3bdb0c664b5b80cf8bdf
  test_setup:
  - - make
    - -C
    - '{source:pgtap}'
    - PG_CONFIG={prefix}/bin/pg_config
    - all
    - install
  test_commands:
  - id: pgtap
    argv:
    - bash
    - ./tools/testers/pg_prove_tests.sh
    - '{user}'
    - '{port}'
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
  test_database: ___pgr___test___
