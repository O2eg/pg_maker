api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc18-pglogical
  revision: 3
spec:
  type: pgxs
  source:
    kind: archive
    location: https://codeload.github.com/2ndQuadrant/pglogical/tar.gz/51a9344215ae756d6165f0bc1e5cb40289f806c6
    sha256: sha256:ee5654e1612c55949817922d45745e3437b6405acec8640d0c3278f8e5457a88
    strip_components: 1
  source_patches:
  - ../../patches/pglogical-pg18-tests.patch
  - ../../patches/pglogical-pg18-sync.patch
  compatible_postgresql: '>=18.6,<19'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: pglogical
  runtime_files:
  - bin/pglogical_create_subscriber
  - lib/postgresql/pglogical*.so
  - share/postgresql/extension/pglogical*.control
  - share/postgresql/extension/pglogical*--*.sql
  sql_extension_versions:
    pglogical: 2.4.6
    pglogical_origin: 1.0.0
  preload:
  - pglogical
  test_cluster: false
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - regresscheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: tap
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - check_prove
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
