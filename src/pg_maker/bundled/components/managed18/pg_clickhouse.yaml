api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc18-pg-clickhouse
  revision: 1
spec:
  type: pgxs
  source:
    kind: git
    repository: https://github.com/ClickHouse/pg_clickhouse.git
    ref: 4e05bffcae7db4a2a73eca0ca7d95e6c55ddd5c4
  compatible_postgresql: '>=18.4,<19'
  requires: []
  conflicts: []
  build_dependencies:
  - libcurl4-openssl-dev
  - libssl-dev
  - liblz4-dev
  - libzstd-dev
  - uuid-dev
  runtime_dependencies:
  - libcurl4t64
  - libssl3t64
  - liblz4-1
  - libzstd1
  - libuuid1
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: pg_clickhouse
  runtime_files:
  - lib/postgresql/pg_clickhouse*.so
  - share/postgresql/extension/pg_clickhouse.control
  - share/postgresql/extension/pg_clickhouse--*.sql
  sql_extension_versions:
    pg_clickhouse: '0.3'
  extra_sources:
    clickhouse:
      kind: archive
      location: https://github.com/ClickHouse/ClickHouse/releases/download/v26.3.11.36-lts/clickhouse-common-static-26.3.11.36-amd64.tgz
      sha256: sha256:3f92f9c363509a4e0d03cdc215e09b0c1bf45e8d8ef3bab90e3dd37d4aca2722
      strip_components: 1
  test_commands:
  - id: upstream-with-clickhouse
    argv:
    - python3
    - '{test_helpers}/clickhouse.py'
    - '{source:clickhouse}'
    - '{prefix}'
    - '{jobs}'
    success_pattern: All (?P<count>\d+) tests passed\.
  extra_source_roles:
    clickhouse: test
