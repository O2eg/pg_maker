api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc18-vectorscale
  revision: 4
spec:
  type: utility
  source:
    kind: archive
    location: https://codeload.github.com/timescale/pgvectorscale/tar.gz/c66cae4b621664b68546587da9fafd80b791e643
    sha256: sha256:ed8347b7a5fe62763ecc13fafac04289b50615e284ffc297f9cc0f195a878906
    strip_components: 1
  compatible_postgresql: '>=18.6,<19'
  requires:
  - yc18-vector
  conflicts: []
  build_dependencies:
  - libclang-dev
  - libssl-dev
  - pkg-config
  - python3-psycopg2
  - python3-pytest
  - python3-numpy
  - python3-pytest-timeout
  runtime_dependencies: []
  make_targets: []
  test_targets: []
  install_targets: []
  required_tests: []
  sql_extension: vectorscale
  runtime_files:
  - lib/postgresql/vectorscale*.so
  - share/postgresql/extension/vectorscale.control
  - share/postgresql/extension/vectorscale--*.sql
  sql_extension_versions:
    vectorscale: 0.9.0
  extra_source_catalogs:
  - ../../catalogs/yc18-cargo-sources.yaml
  source_patches:
  - ../../patches/vectorscale-0.9.0-cargo-lock.patch
  test_cluster: false
  extra_sources:
    cargo-pgrx:
      kind: archive
      location: https://static.crates.io/crates/cargo-pgrx/cargo-pgrx-0.16.1.crate
      sha256: sha256:4d6c15f9fef6a2776c92eb62e3b16b09468c4eb157c4096f84986e230e0d9474
      strip_components: 1
    rustc:
      kind: archive
      location: https://static.rust-lang.org/dist/rustc-1.91.1-x86_64-unknown-linux-gnu.tar.xz
      sha256: sha256:4b4c596fc5268435c310a79c2e231a5a3567572c930ac0740ef9e147e83baf4e
      strip_components: 1
    rust-std:
      kind: archive
      location: https://static.rust-lang.org/dist/rust-std-1.91.1-x86_64-unknown-linux-gnu.tar.xz
      sha256: sha256:2023ed689529516d7bd5533738ca6d205b2561f8d51947dabeeb39dd51a024c9
      strip_components: 1
    cargo:
      kind: archive
      location: https://static.rust-lang.org/dist/cargo-1.91.1-x86_64-unknown-linux-gnu.tar.xz
      sha256: sha256:8d17d5a4734e684228adee4ea4a75da94eb7f71993804adf29f344709e65fe09
      strip_components: 1
    rustfmt:
      kind: archive
      location: https://static.rust-lang.org/dist/rustfmt-1.91.1-x86_64-unknown-linux-gnu.tar.xz
      sha256: sha256:4e1848cb39796f6927e9fc3bd2720299fb81349f4480cd68a5c3cf1b61649b53
      strip_components: 1
  build_commands:
  - argv:
    - python3
    - '{test_helpers}/vectorscale.py'
    - build
    - '{prefix}'
    - '{jobs}'
    - '{source:cargo-pgrx}'
  test_commands:
  - id: pgrx-and-python
    argv:
    - python3
    - '{test_helpers}/vectorscale.py'
    - test
    - '{prefix}'
    - '{jobs}'
    - '{source:cargo-pgrx}'
    success_pattern: ^PG_MAKER_VECTORSCALE_TESTS_PASSED=(?P<count>\d+)$
