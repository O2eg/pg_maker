api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: icu70
  revision: 3
spec:
  type: library
  build_phase: before-postgresql
  source:
    kind: archive
    location: https://github.com/unicode-org/icu/releases/download/release-70-1/icu4c-70_1-src.tgz
    sha256: sha256:8d205428c17bf13bb535300669ed28b338a157b1c01ae66d31d0d3e2d47c3fd5
    strip_components: 1
  source_directory: source
  source_patches:
  - ../../patches/icu70-python313-tests.patch
  compatible_postgresql: '>=14,<20'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  configure_args:
  - --libdir={prefix}/lib
  - --enable-shared
  - --disable-static
  - --with-data-packaging=library
  make_targets:
  - all
  test_targets:
  - check
  install_targets:
  - install
  required_tests: []
  runtime_files:
  - lib/libicudata.so.70*
  - lib/libicui18n.so.70*
  - lib/libicuuc.so.70*
  pkg_config_versions:
    icu-i18n: '70.1'
    icu-uc: '70.1'
  provides_options:
  - icu
  test_cluster: false
  test_commands:
  - id: icu-check
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - check
    success_pattern: 'OK: All tests passed without error\.'
  installed_checks:
  - argv:
    - '{prefix}/bin/psql'
    - -X
    - -v
    - ON_ERROR_STOP=1
    - -Atqc
    - SELECT pg_collation_actual_version(oid) FROM pg_collation WHERE collname='en-US-x-icu'
    timeout_seconds: 60
    stdout_contains: '153.112'
