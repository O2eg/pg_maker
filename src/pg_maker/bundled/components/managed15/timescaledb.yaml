api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc15-timescaledb
  revision: 1
spec:
  type: library
  source:
    kind: archive
    location: https://codeload.github.com/timescale/timescaledb/tar.gz/7c78574c4d42ec7ceb840bd9d55652182221f251
    strip_components: 1
    sha256: sha256:a998200b72ee135d3c5b200c163c01e1a06e420673d4cfe25f5ce62f254a7901
  source_patches:
  - ../../patches/timescaledb-2.16-archive-metadata.patch
  compatible_postgresql: '>=15.18,<16'
  requires: []
  conflicts: []
  build_dependencies:
  - cmake
  - libssl-dev
  runtime_dependencies:
  - libssl3t64
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: timescaledb
  runtime_files:
  - lib/postgresql/timescaledb.so
  - lib/postgresql/timescaledb-2.16.1.so
  - share/postgresql/extension/timescaledb.control
  - share/postgresql/extension/timescaledb--*.sql
  sql_extension_versions:
    timescaledb: 2.16.1
  build_system: cmake
  configure_args:
  - -DPG_CONFIG={prefix}/bin/pg_config
  - -DREGRESS_CHECKS=ON
  - -DTAP_CHECKS=ON
  - -DWARNINGS_AS_ERRORS=OFF
  - -DREQUIRE_ALL_TESTS=ON
  - -DPG_SOURCE_DIR={postgresql_source}
  - -DPG_ISOLATION_REGRESS={postgresql_build}/src/test/isolation/pg_isolation_regress
  - -DAPACHE_ONLY=ON
  - -DEXT_GIT_COMMIT_TAG=2.16.1
  - -DEXT_GIT_COMMIT_HASH=7c78574c4d42ec7ceb840bd9d55652182221f251
  - -DEXT_GIT_COMMIT_TIME=2024-08-06T14:55:10Z
  preload:
  - timescaledb
  test_cluster: false
  test_commands:
  - id: upstream-installcheck
    env:
      PGTZ: US/Pacific
      PG_REGRESS_OPTS: --encoding=UTF8
      LANG: C.UTF-8
      LC_CTYPE: C.UTF-8
    argv:
    - cmake
    - --build
    - '{build}'
    - --target
    - installcheck
    - --parallel
    - '1'
    success_pattern: All (?P<count>\d+) tests passed\.
