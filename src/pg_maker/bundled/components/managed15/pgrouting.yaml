api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc15-pgrouting
  revision: 1
spec:
  type: library
  source:
    kind: archive
    location: https://codeload.github.com/pgRouting/pgrouting/tar.gz/441037f0c5b2b6fa9d1ff355c845fa15247803dd
    strip_components: 1
    sha256: sha256:16eb442793466db168d072113dbd1dbb1ef03a86c57bae0cb99cf76ccf6278ea
  compatible_postgresql: '>=15.18,<16'
  requires:
  - yc15-postgis
  conflicts: []
  build_dependencies:
  - cmake
  - libboost-graph-dev
  - libtap-parser-sourcehandler-pgtap-perl
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: pgrouting
  runtime_files:
  - lib/postgresql/libpgrouting-3.4.so
  - share/postgresql/extension/pgrouting.control
  - share/postgresql/extension/pgrouting--*.sql
  sql_extension_versions:
    pgrouting: 3.4.1
  build_system: cmake
  configure_args:
  - -DPOSTGRESQL_PG_CONFIG={prefix}/bin/pg_config
  - -DPOSTGRESQL_BIN={prefix}/bin
  - -DWITH_DOC=OFF
  extra_sources:
    pgtap:
      kind: git
      repository: https://github.com/theory/pgtap.git
      ref: 968eb53a33114e83042b3bdb0c664b5b80cf8bdf
  test_setup:
  - - make
    - -C
    - '{source:pgtap}'
    - PG_CONFIG={prefix}/bin/pg_config
    - all
    - install
  test_commands:
  - id: pgtap
    argv:
    - bash
    - ./tools/testers/pg_prove_tests.sh
    - '{user}'
    - '{port}'
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
  test_database: ___pgr___test___
  source_patches:
  - ../../patches/pgrouting-3.4.1-gcc14.patch
