api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc15-clickhouse-fdw
  revision: 1
spec:
  type: library
  source:
    kind: archive
    location: https://codeload.github.com/adjust/clickhouse_fdw/tar.gz/a2cd63da0fbdd10be8e2948494e6cdc8bfc88016
    strip_components: 1
    sha256: sha256:22d15fc4125fb394f017aaeb5d7f5162ba17cd4c60b28fa8c52c4ce0d174950c
  compatible_postgresql: '>=15.18,<16'
  requires: []
  conflicts: []
  build_dependencies:
  - libcurl4-openssl-dev
  - libssl-dev
  - liblz4-dev
  - libzstd-dev
  - uuid-dev
  - cmake
  runtime_dependencies:
  - libcurl4t64
  - libssl3t64
  - liblz4-1
  - libzstd1
  - libuuid1
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: clickhouse_fdw
  runtime_files:
  - lib/postgresql/clickhouse_fdw.so
  - share/postgresql/extension/clickhouse_fdw.control
  - share/postgresql/extension/clickhouse_fdw--*.sql
  sql_extension_versions:
    clickhouse_fdw: '1.4'
  extra_sources:
    clickhouse:
      kind: archive
      location: https://github.com/ClickHouse/ClickHouse/releases/download/v26.3.11.36-lts/clickhouse-common-static-26.3.11.36-amd64.tgz
      sha256: sha256:3f92f9c363509a4e0d03cdc215e09b0c1bf45e8d8ef3bab90e3dd37d4aca2722
      strip_components: 1
  test_commands:
  - id: upstream-with-clickhouse
    argv:
    - python3
    - '{test_helpers}/clickhouse.py'
    - '{source:clickhouse}'
    - '{prefix}'
    - '{jobs}'
    - '{build}'
    success_pattern: All (?P<count>\d+) tests passed\.
  extra_source_roles:
    clickhouse: test
  build_system: cmake
  configure_args:
  - -DPG_CONFIG={prefix}/bin/pg_config
