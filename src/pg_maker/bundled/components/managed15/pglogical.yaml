api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc15-pglogical
  revision: 1
spec:
  type: pgxs
  source:
    kind: archive
    location: https://codeload.github.com/2ndQuadrant/pglogical/tar.gz/bff71f2c6b0bd9748ecee15dcc93201cd1a145a0
    strip_components: 1
    sha256: sha256:87f2541c132471a1e3957212b17f08bca78d9998219928b95843e698b18926c7
  source_patches:
  - ../../patches/pglogical-pg16-tests.patch
  - ../../patches/pglogical-idle-sync.patch
  - ../../patches/pglogical-resync-cache.patch
  compatible_postgresql: '>=15.18,<16'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: pglogical
  runtime_files:
  - bin/pglogical_create_subscriber
  - lib/postgresql/pglogical*.so
  - share/postgresql/extension/pglogical*.control
  - share/postgresql/extension/pglogical*--*.sql
  sql_extension_versions:
    pglogical: 2.4.4
    pglogical_origin: 1.0.0
  preload:
  - pglogical
  test_cluster: false
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - regresscheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: tap
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - check_prove
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
  test_setup:
  - - python3
    - '{test_helpers}/pglogical.py'
    - '{prefix}'
