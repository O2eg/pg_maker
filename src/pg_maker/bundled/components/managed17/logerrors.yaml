api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc17-logerrors
  revision: 1
spec:
  type: pgxs
  source:
    kind: archive
    location: https://codeload.github.com/munakoiso/logerrors/tar.gz/c72bbe833c216814495cd9b4d32270dd18dd253b
    sha256: sha256:f3a51309b110a6e7f47db1e3d7130875358c5e005287bd07b0925a6a3cb71a2a
    strip_components: 1
  compatible_postgresql: '>=17.11,<18'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: logerrors
  runtime_files:
  - lib/postgresql/logerrors.so
  - share/postgresql/extension/logerrors.control
  - share/postgresql/extension/logerrors--*.sql
  sql_extension_versions:
    logerrors: '2.1'
  preload:
  - logerrors
  test_commands:
  - id: upstream-regression
    argv:
    - make
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - installcheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: error-log-functions
    argv:
    - python3
    - '{test_helpers}/logerrors.py'
    success_pattern: ^PG_MAKER_LOGERRORS_CHECKS_PASSED=(?P<count>\d+)$
