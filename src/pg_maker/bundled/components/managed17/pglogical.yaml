api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc17-pglogical
  revision: 4
spec:
  type: pgxs
  source:
    kind: archive
    location: https://codeload.github.com/2ndQuadrant/pglogical/tar.gz/8579de3b2557355008ddac13ce05663942eedddf
    sha256: sha256:dc3dde2f22d5cabfb795e0e0e0acf57789efa868251306589adabe5baaa292be
    strip_components: 1
  source_patches:
  - ../../patches/pglogical-pg17-tests.patch
  - ../../patches/pglogical-pg17-sync.patch
  - ../../patches/pglogical-pg17-ddl-fixture.patch
  - path: ../../patches/pglogical-pg17-before-output-plugin.patch
    compatible_postgresql: '>=17.10,<17.11'
  - ../../patches/pglogical-pg17-resync-relcache.patch
  compatible_postgresql: '>=17.10,<18'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: pglogical
  runtime_files:
  - bin/pglogical_create_subscriber
  - lib/postgresql/pglogical*.so
  - share/postgresql/extension/pglogical*.control
  - share/postgresql/extension/pglogical*--*.sql
  sql_extension_versions:
    pglogical: 2.4.5
    pglogical_origin: 1.0.0
  preload:
  - pglogical
  test_cluster: false
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - regresscheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: tap
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - check_prove
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
