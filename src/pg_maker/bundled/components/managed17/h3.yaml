api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc17-h3
  revision: 1
spec:
  type: library
  source:
    kind: archive
    location: https://codeload.github.com/postgis/h3-pg/tar.gz/a6d98a41ebf9cb3b0c91dedfa6e248e72b27aed3
    sha256: sha256:a42c39f272de28a9562dc7251bb55b6b0319a4ddacb3f9925c5af8483b6261b9
    strip_components: 1
  compatible_postgresql: '>=17.11,<18'
  requires:
  - yc17-postgis
  conflicts: []
  build_dependencies:
  - cmake
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: h3
  runtime_files:
  - lib/postgresql/h3*.so
  - share/postgresql/extension/h3*.control
  - share/postgresql/extension/h3*--*.sql
  sql_extension_versions:
    h3: 4.1.3
    h3_postgis: 4.1.3
  build_system: cmake
  configure_args:
  - -DPostgreSQL_CONFIG={prefix}/bin/pg_config
  - -DPOSTGRESQL_VERSION=17
  - -DBUILD_TESTING=ON
  - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
  - -DFETCHCONTENT_SOURCE_DIR_H3={source:h3-core}
  - -DPostgreSQL_REGRESS={postgresql_build}/src/test/regress/pg_regress
  - -DCMAKE_BUILD_TYPE=Release
  extra_sources:
    h3-core:
      kind: archive
      location: https://github.com/uber/h3/archive/refs/tags/v4.1.0.tar.gz
      sha256: sha256:ec99f1f5974846bde64f4513cf8d2ea1b8d172d2218ab41803bf6a63532272bc
      strip_components: 1
  test_cluster: false
  test_commands:
  - id: ctest
    argv:
    - ctest
    - --test-dir
    - '{build}'
    - --output-on-failure
    - --no-tests=error
    - -C
    - Release
    success_pattern: 100% tests passed, 0 tests failed out of (?P<count>\d+)
