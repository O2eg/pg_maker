api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc17-vector
  revision: 1
spec:
  type: pgxs
  source:
    kind: archive
    location: https://codeload.github.com/pgvector/pgvector/tar.gz/cab9da72c04353f143bb06b42ab70a403daac64a
    sha256: sha256:0af705b6c9b2a3a1fd1f6fd991425c125387d3c8edc68b75ef027d2e0a05e57a
    strip_components: 1
  compatible_postgresql: '>=17.10,<18'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: vector
  runtime_files:
  - lib/postgresql/vector.so
  - share/postgresql/extension/vector.control
  - share/postgresql/extension/vector--*.sql
  sql_extension_versions:
    vector: 0.8.2
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - installcheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: tap
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - prove_installcheck
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
  source_patches:
  - ../../patches/pgvector-0.8.2-portable-cpu.patch
