api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc-pgrouting
  revision: 4
spec:
  type: library
  source:
    kind: git
    repository: https://github.com/pgRouting/pgrouting.git
    ref: 55c68b0a2417d2ca5d6145fca5389763c67b0760
  source_patches:
  - ../../patches/pgrouting-3.5.0-gcc14.patch
  - ../../patches/pgrouting-3.5-tests.patch
  compatible_postgresql: '>=16,<17'
  requires:
  - yc-postgis
  conflicts: []
  build_dependencies:
  - cmake
  - libboost-graph-dev
  - libtap-parser-sourcehandler-pgtap-perl
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: pgrouting
  runtime_files:
  - lib/postgresql/libpgrouting-3.5.so
  - share/postgresql/extension/pgrouting.control
  - share/postgresql/extension/pgrouting--*.sql
  sql_extension_versions:
    pgrouting: 3.5.0
  build_system: cmake
  configure_args:
  - -DPOSTGRESQL_PG_CONFIG={prefix}/bin/pg_config
  - -DPOSTGRESQL_BIN={prefix}/bin
  - -DWITH_DOC=OFF
  extra_sources:
    pgtap:
      kind: git
      repository: https://github.com/theory/pgtap.git
      ref: 968eb53a33114e83042b3bdb0c664b5b80cf8bdf
  test_setup:
  - - make
    - -C
    - '{source:pgtap}'
    - PG_CONFIG={prefix}/bin/pg_config
    - all
    - install
  test_commands:
  - id: pgtap
    argv:
    - bash
    - ./tools/testers/pg_prove_tests.sh
    - '{user}'
    - '{port}'
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
  # The upstream script installs fixtures into this existing database.
  test_database: ___pgr___test___
