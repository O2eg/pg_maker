api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc-pg-repack
  revision: 3
spec:
  type: pgxs
  source:
    kind: git
    repository: https://github.com/reorg/pg_repack.git
    ref: 6902ab313aeb49227867087dca99cf107f7be23b
  compatible_postgresql: '>=16,<17'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: pg_repack
  runtime_files:
  - bin/pg_repack
  - lib/postgresql/pg_repack.so
  - share/postgresql/extension/pg_repack.control
  - share/postgresql/extension/pg_repack--*.sql
  sql_extension_versions:
    pg_repack: 1.5.3
  # Same four fixtures as upstream regress/create_tablespaces.sh, using the
  # disposable cluster's builder role and paths inside its private workspace.
  test_setup:
  - [mkdir, -p, '{component}/tablespaces/ts1', '{component}/tablespaces/ts2',
     '{component}/tablespaces/ts3', '{component}/tablespaces/ts4']
  - - '{prefix}/bin/psql'
    - -X
    - -v
    - ON_ERROR_STOP=1
    - -c
    - "CREATE TABLESPACE testts LOCATION '{component}/tablespaces/ts1'"
    - -c
    - "CREATE TABLESPACE \"1testts\" LOCATION '{component}/tablespaces/ts2'"
    - -c
    - "CREATE TABLESPACE \"test ts\" LOCATION '{component}/tablespaces/ts3'"
    - -c
    - "CREATE TABLESPACE \"test\"\"ts\" LOCATION '{component}/tablespaces/ts4'"
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - installcheck
    success_pattern: All (?P<count>\d+) tests passed\.
