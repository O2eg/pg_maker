api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc-pglogical
  revision: 5
spec:
  type: pgxs
  source:
    kind: git
    repository: https://github.com/2ndQuadrant/pglogical.git
    ref: bff71f2c6b0bd9748ecee15dcc93201cd1a145a0
  source_patches:
  - ../../patches/pglogical-pg16-tests.patch
  # Upstream 7acb02405be5471d9827bd62b37c810038e262e3; preserves SQL version 2.4.4.
  - ../../patches/pglogical-idle-sync.patch
  # Local fix with a deterministic blocked-apply regression test.
  - ../../patches/pglogical-resync-cache.patch
  compatible_postgresql: '>=16.14,<17'
  requires: []
  conflicts: []
  build_dependencies: []
  runtime_dependencies: []
  make_targets:
  - all
  test_targets:
  - installcheck
  install_targets:
  - install
  required_tests: []
  sql_extension: pglogical
  runtime_files:
  - bin/pglogical_create_subscriber
  - lib/postgresql/pglogical*.so
  - share/postgresql/extension/pglogical*.control
  - share/postgresql/extension/pglogical*--*.sql
  sql_extension_versions:
    pglogical: 2.4.4
    pglogical_origin: 1.0.0
  preload:
  - pglogical
  test_cluster: false
  test_commands:
  - id: regression
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    # PGXS check also prints an unsupported-target error after regresscheck passes.
    - regresscheck
    success_pattern: All (?P<count>\d+) tests passed\.
  - id: tap
    argv:
    - make
    - --output-sync=target
    - -j
    - '{jobs}'
    - USE_PGXS=1
    - PG_CONFIG={prefix}/bin/pg_config
    - check_prove
    success_pattern: Files=\d+, Tests=(?P<count>\d+)
