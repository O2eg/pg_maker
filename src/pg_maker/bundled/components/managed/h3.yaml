api_version: pg_maker/component/v1
kind: ComponentRecipe
metadata:
  id: yc-h3
  revision: 1
spec:
  type: library
  source:
    kind: git
    repository: https://github.com/postgis/h3-pg.git
    ref: a6d98a41ebf9cb3b0c91dedfa6e248e72b27aed3
  compatible_postgresql: '>=16,<17'
  requires:
  - yc-postgis
  conflicts: []
  build_dependencies:
  - cmake
  runtime_dependencies: []
  make_targets:
  - all
  test_targets: []
  install_targets:
  - install
  required_tests: []
  sql_extension: h3
  runtime_files:
  - lib/postgresql/h3*.so
  - share/postgresql/extension/h3*.control
  - share/postgresql/extension/h3*--*.sql
  sql_extension_versions:
    h3: 4.1.3
    h3_postgis: 4.1.3
  build_system: cmake
  configure_args:
  - -DPostgreSQL_CONFIG={prefix}/bin/pg_config
  - -DPOSTGRESQL_VERSION=16
  - -DBUILD_TESTING=OFF
  - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
  - -DFETCHCONTENT_SOURCE_DIR_H3={source:h3-core}
  extra_sources:
    h3-core:
      kind: archive
      location: https://github.com/uber/h3/archive/refs/tags/v4.1.0.tar.gz
      sha256: sha256:ec99f1f5974846bde64f4513cf8d2ea1b8d172d2218ab41803bf6a63532272bc
      strip_components: 1
