# Candidate profile: managed physical binary compatibility is required but not verified.
# See docs/yc-clone-compatibility.md; a successful build does not remove catalog blockers.
api_version: pg_maker/v1
kind: PostgreSQLBuild
metadata:
  name: yc-16-14-icu70
spec:
  config_dir: ./config
  source:
    kind: archive
    location: https://ftp.postgresql.org/pub/source/v16.14/postgresql-16.14.tar.bz2
    sha256: sha256:f6d077142737920858ce958ccdb75c6ee137a63b5b0853c70693d401ac7e3471
    strip_components: 1
  postgresql:
    version: '16.14'
  product:
    release: 0
    package_revision: 1
    version_format: postgresql
  naming:
    package_by_role:
      server: 'postgresql-{postgresql.major}{build.mode_suffix}-yc-clone'
      client: 'postgresql-client-{postgresql.major}{build.mode_suffix}-yc-clone'
      libpq: 'libpq{role.abi_suffix}{build.mode_suffix}-yc-clone'
      docs: 'postgresql-doc-{postgresql.major}{build.mode_suffix}-yc-clone'
  features:
  - yc16-icu70
  targets:
  - id: debian13-x64
    platform: debian-13
    architecture: x86_64
    cpu_target: x86-64
    artifacts:
    - deb
  documentation:
    profile: ./config/documentation.yaml
  validation:
    profile: full
    baseline: false
  packaging:
    standard_contrib: true
    server_dev_files: true
  build:
    options:
      llvm: false
